[advisories]
yanked = "deny"
ignore = [
    "RUSTSEC-2023-0089", # unmaintained: postcard -> heapless -> atomic-polyfill
    "RUSTSEC-2024-0436", # unmaintained: paste, pulled in by netlink-packet-core
    "RUSTSEC-2024-0370", # unmaintained: proc-macro-error, pulled in by genawaiter (bao-tree, iroh-blobs)
    "RUSTSEC-2026-0253", # lru 0.16, via pkarr 5 and mainline 6. Fixed in lru 0.18.2
]

[bans]
deny = [
    "native-tls",
    "openssl",
]
multiple-versions = "allow"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]

[sources]
allow-git = []
